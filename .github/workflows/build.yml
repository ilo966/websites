name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -q veil-android.zip
      - run: gradle -p veil-android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: veil-debug-apk
          path: veil-android/app/build/outputs/apk/debug/app-debug.apk
